[pytest]
# Pytest configuration for txt2phrases
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --tb=short
    -v
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests
    cli: marks CLI tests
    requires_model: marks tests that need actual transformer models (may download models)

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
